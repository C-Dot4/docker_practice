<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-Dot</title>

    <style>
        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root
        {
            --background: #080808;
            --surface: #111111;
            --border: #242424;
            --text: #f2f2f2;
            --muted: #9a9a9a;
            --accent: #ffffff;
        }

        html
        {
            scroll-behavior: smooth;
        }

        body
        {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        header
        {
            width: 100%;
            border-bottom: 1px solid var(--border);
        }

        .nav
        {
            width: min(1400px, calc(100% - 48px));
            height: 82px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand
        {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-mark
        {
            width: 34px;
            height: 34px;
            border: 2px solid var(--text);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 0.8rem;
            font-weight: 800;
        }

        .status
        {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .status-dot
        {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6fcf97;
            box-shadow: 0 0 12px rgba(111, 207, 151, 0.5);
        }

        main
        {
            min-height: calc(100vh - 83px);
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
        }

        .hero
        {
            width: min(850px, calc(100% - 48px));
            padding: 80px 0;
        }

        .eyebrow
        {
            margin-bottom: 20px;
            color: #747474;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1
        {
            max-width: 760px;
            font-size: clamp(4rem, 10vw, 8rem);
            line-height: 0.92;
            letter-spacing: -0.07em;
            font-weight: 800;
        }

        .intro
        {
            max-width: 680px;
            margin-top: 30px;
            color: var(--muted);
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            line-height: 1.65;
        }

        .intro strong
        {
            color: var(--text);
            font-weight: 600;
        }

        .tag
        {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 40px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            color: #bcbcbc;
            font-size: 0.9rem;
        }

        .tag::before
        {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
        }

        .rail
        {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            width: 62px;
            height: 260px;
            border: 1px solid var(--border);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
        }

        .rail span
        {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #555555;
        }

        .rail span.active
        {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            background: #151515;
        }

        .rail span.active::after
        {
            content: "";
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #e8e8e8;
        }

        .glow
        {
            position: absolute;
            right: -170px;
            bottom: -200px;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.055), transparent 67%);
            pointer-events: none;
        }

        @media (max-width: 760px)
        {
            .nav
            {
                width: min(100% - 32px, 1400px);
                height: 72px;
            }

            .status
            {
                display: none;
            }

            .rail
            {
                display: none;
            }

            .hero
            {
                width: min(100% - 32px, 850px);
                padding: 64px 0;
            }

            h1
            {
                font-size: clamp(3.7rem, 20vw, 6rem);
            }

            .intro
            {
                margin-top: 24px;
                font-size: 1.05rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav class="nav">
            <div class="brand">
                <div class="brand-mark">C.</div>
                <span>C-Dot</span>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span>Sample Docker Website</span>
            </div>
        </nav>
    </header>

    <main>
        <div class="rail" aria-hidden="true">
            <span></span>
            <span></span>
            <span class="active"></span>
            <span></span>
            <span></span>
        </div>

        <section class="hero">
            <p class="eyebrow">Hello, I'm</p>

            <h1>C-Dot.</h1>

            <p class="intro">
                A <strong>Computer Science student</strong> who enjoys building
                simple, practical, and useful software. This is a lightweight
                personal landing page created as a sample project for testing
                GitHub and Docker.
            </p>

            <div class="tag">
                One page. One HTML file. Docker ready.
            </div>
        </section>

        <div class="glow" aria-hidden="true"></div>
    </main>
</body>
</html>
